<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrackMe — Sign In (Minimal & Modern SaaS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          boxShadow: {
            'soft-card': '0 1px 3px rgba(0, 0, 0, 0.02), 0 12px 36px -4px rgba(0, 0, 0, 0.05)',
            'soft-input': '0 1px 2px rgba(0, 0, 0, 0.03)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f8f9fa;
      color: #09090b;
      font-family: 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
    }
    .ambient-glow {
      position: absolute;
      width: 600px;
      height: 500px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(99, 102, 241, 0.06) 0%, rgba(244, 114, 182, 0.03) 40%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative p-4 sm:p-6 antialiased selection:bg-zinc-900 selection:text-white">

  <div class="ambient-glow"></div>

  <!-- Header Navigation -->
  <header class="relative z-10 max-w-5xl w-full mx-auto flex items-center justify-between py-2">
    <div class="flex items-center space-x-2.5">
      <div class="h-8 w-8 rounded-xl bg-zinc-900 flex items-center justify-center text-white font-bold text-xs shadow-sm">
        <svg class="w-4 h-4 text-zinc-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="font-bold text-base tracking-tight text-zinc-900">TrackMe</span>
    </div>

    <!-- Prototype Nav Switcher -->
    <div class="flex items-center space-x-2 text-xs">
      <a href="clean_dashboard.html" class="px-3 py-1.5 rounded-lg text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 font-medium transition">Dashboard</a>
      <a href="onboarding.html" class="px-3 py-1.5 rounded-lg text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 font-medium transition">Onboarding</a>
      <a href="settings.html" class="px-3 py-1.5 rounded-lg text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 font-medium transition">Settings</a>
    </div>
  </header>

  <!-- Centered Auth Card -->
  <main class="relative z-10 max-w-[420px] w-full mx-auto my-auto py-8">
    <div class="bg-white border border-zinc-200/90 rounded-2xl p-7 sm:p-8 shadow-soft-card">
      
      <!-- Title & Subtitle -->
      <div class="text-center mb-6">
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-zinc-900">Welcome to TrackMe</h1>
        <p class="text-xs sm:text-sm text-zinc-500 mt-1.5">
          Cookieless, real-time analytics designed for high-velocity engineering teams.
        </p>
      </div>

      <!-- Auth Mode Tabs (Sign In / Register) -->
      <div class="flex items-center p-1 bg-zinc-100 rounded-xl mb-5 text-xs font-semibold text-zinc-600">
        <button id="tabSignIn" class="flex-1 py-1.5 rounded-lg bg-white text-zinc-900 shadow-sm transition">Sign In</button>
        <button id="tabSignUp" class="flex-1 py-1.5 rounded-lg hover:text-zinc-900 transition">Create Account</button>
      </div>

      <!-- SSO Social Buttons (GitHub & Google) -->
      <div class="space-y-2.5 mb-5">
        <button class="w-full py-2.5 px-4 rounded-xl border border-zinc-200 hover:border-zinc-300 bg-white hover:bg-zinc-50/80 text-zinc-700 font-medium text-xs flex items-center justify-center space-x-2.5 shadow-soft-input transition">
          <svg class="w-4 h-4 text-zinc-900" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          <span>Continue with GitHub</span>
        </button>

        <button class="w-full py-2.5 px-4 rounded-xl border border-zinc-200 hover:border-zinc-300 bg-white hover:bg-zinc-50/80 text-zinc-700 font-medium text-xs flex items-center justify-center space-x-2.5 shadow-soft-input transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <!-- Divider -->
      <div class="relative flex items-center justify-center my-5">
        <div class="border-t border-zinc-200/80 w-full"></div>
        <span class="bg-white px-3 text-[11px] uppercase tracking-wider text-zinc-400 font-mono">or email</span>
      </div>

      <!-- Email Form -->
      <form class="space-y-3.5" onsubmit="event.preventDefault();">
        <div>
          <label class="block text-xs font-semibold text-zinc-700 mb-1.5">Work Email</label>
          <input
            type="email"
            placeholder="name@company.com"
            class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-200 bg-zinc-50/50 text-zinc-900 placeholder-zinc-400 text-xs focus:outline-none focus:border-zinc-900 focus:bg-white transition"
            required
          />
        </div>

        <div id="passwordField">
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold text-zinc-700">Password</label>
            <a href="#" class="text-[11px] text-zinc-500 hover:text-zinc-900">Forgot?</a>
          </div>
          <input
            type="password"
            placeholder="••••••••••••"
            class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-200 bg-zinc-50/50 text-zinc-900 placeholder-zinc-400 text-xs focus:outline-none focus:border-zinc-900 focus:bg-white transition"
          />
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full py-2.5 px-4 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-white font-semibold text-xs shadow-sm transition flex items-center justify-center space-x-1.5"
        >
          <span>Sign In to Dashboard</span>
          <span>→</span>
        </button>
      </form>

      <!-- Security / Privacy Promise -->
      <div class="mt-6 pt-4 border-t border-zinc-100 text-center">
        <div class="flex items-center justify-center space-x-1.5 text-[11px] text-zinc-500 font-medium">
          <svg class="w-3.5 h-3.5 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Zero cross-site trackers or personal identifiable storage.</span>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="relative z-10 max-w-5xl w-full mx-auto py-3 text-center text-xs text-zinc-400">
    <span>TrackMe Analytics · Cookieless & Real-time · </span>
    <a href="#" class="hover:text-zinc-700">Terms of Service</a> · 
    <a href="#" class="hover:text-zinc-700">Privacy Policy</a>
  </footer>

  <script>
    const tabSignIn = document.getElementById('tabSignIn');
    const tabSignUp = document.getElementById('tabSignUp');
    const pwdField = document.getElementById('passwordField');

    tabSignIn.addEventListener('click', () => {
      tabSignIn.classList.add('bg-white', 'text-zinc-900', 'shadow-sm');
      tabSignIn.classList.remove('hover:text-zinc-900');
      tabSignUp.classList.remove('bg-white', 'text-zinc-900', 'shadow-sm');
      tabSignUp.classList.add('hover:text-zinc-900');
    });

    tabSignUp.addEventListener('click', () => {
      tabSignUp.classList.add('bg-white', 'text-zinc-900', 'shadow-sm');
      tabSignUp.classList.remove('hover:text-zinc-900');
      tabSignIn.classList.remove('bg-white', 'text-zinc-900', 'shadow-sm');
      tabSignIn.classList.add('hover:text-zinc-900');
    });
  </script>
</body>
</html>
