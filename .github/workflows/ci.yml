name: Monorepo CI Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default token can read the repository and nothing else; a job that needs more asks for it explicitly.
permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Turborepo Packages
        run: pnpm typecheck

      - name: Run Unit & Contract Tests
        run: pnpm test

      - name: Build Packages & Services
        run: pnpm build


  go-edge:
    name: Go edge vet and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion-go
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/ingestion-go/go.mod
          cache-dependency-path: services/ingestion-go/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Vet ingest-proxy
        working-directory: services/ingest-proxy
        run: go vet ./...

      - name: Test ingest-proxy
        working-directory: services/ingest-proxy
        run: go test ./...

      - name: Known vulnerabilities in Go dependencies (edge)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Known vulnerabilities in Go dependencies (ingest-proxy)
        working-directory: services/ingest-proxy
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (full history, for secret scanning)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
          run_install: false

      # Each rule in scripts/security-guard.mjs corresponds to a vulnerability that was found and fixed
      # (docs/SECURITY_AUDIT.md). A change that brings the pattern back fails here.
      - name: Security guard rules
        run: node scripts/security-guard.mjs

      - name: Security guard rule tests
        run: node --test scripts/security-guard.test.mjs

      # High and critical advisories in production dependencies fail the build. The one advisory that is
      # ignored on purpose (zod, GHSA-mrhx-c7xc-m3w5) is listed in package.json with its reason in docs/SECURITY_AUDIT.md.
      - name: Dependency advisories (production dependencies)
        run: pnpm audit --prod --audit-level=high

      - name: Secret scan (working tree and history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner --redact --verbose
