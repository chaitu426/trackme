version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /services/ingestion-go
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /services/ingest-proxy
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]