# Example first-party ingest proxy (nginx)
#
# Browser → https://analytics.customer.com/collect  (first-party)
#        → http://ingestion-go:3001/v1/batch         (adds HMAC secret)
#
# The signing secret never appears in public HTML. Enable site setting
# `signingRequired` and store the secret only on this proxy.

upstream trackme_ingest {
  server ingestion-go:3001;
}

server {
  listen 443 ssl http2;
  server_name analytics.example.com;

  # ssl_certificate     /etc/ssl/certs/fullchain.pem;
  # ssl_certificate_key /etc/ssl/private/privkey.pem;

  location = /collect {
    # Only allow browser posts from your product origin(s)
    # if ($http_origin !~* ^https://(www\.)?example\.com$) { return 403; }

    proxy_pass http://trackme_ingest/v1/batch;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Content-Type $content_type;

    # Inject HMAC over the exact request body (requires njs or an app proxy).
    # Plain nginx cannot HMAC the body easily — prefer a tiny Go/Node sidecar:
    #   services/ingestion-go can sit behind your own /collect that signs.
    #
    # Minimal pattern with OpenResty / njs:
    #   proxy_set_header X-GI-Signature $gi_hmac;
  }
}
